[global]
error_log = /proc/self/fd/2
[www]
user = apache
group = apache
listen = /run/php-fpm/www.sock
listen.owner = apache
listen.group = apache
listen.mode = 0660
; No systemd ACL setup in this container.
listen.acl_users =
listen.acl_groups =
; Drupal receives ECS environment variables through PHP-FPM.
clear_env = no
catch_workers_output = yes
